name: build-windows

on:
  workflow_dispatch:
    inputs:
      run_chat_tests:
        description: Run native Chat session/draft regression tests
        type: boolean
        default: true
      run_build_tests:
        description: Run native Build/Chat continuity and connected-send regression tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Finish verification of older commits instead of cancelling a long release
  # build whenever a newer UI change is dispatched. Duplicate SHA runs still cancel.
  group: build-windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  ZED_WORKSPACE: ${{ github.workspace }}
  KNIGHTCODE_ENGINE_DIR: ${{ github.workspace }}/knightcode/packages/cli-win32-x64/bin
  KNIGHTCODE_DESKTOP_RESOURCES_DIR: ${{ github.workspace }}/target/resources/desktop

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Check out the IDE
        uses: actions/checkout@v4

      - name: Read the pinned engine revision
        id: engine-ref
        shell: pwsh
        run: |
          $ref = (Get-Content crates/zed/KNIGHTCODE_REF -Raw).Trim()
          if ($ref -notmatch '^[0-9a-f]{40}$') {
            throw "KNIGHTCODE_REF is not a commit SHA: $ref"
          }
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Check out the matching KnightCode engine
        uses: actions/checkout@v4
        with:
          repository: KnightCodeAI/knightcode
          ref: ${{ steps.engine-ref.outputs.ref }}
          path: knightcode
          persist-credentials: false

      # The engine requires Node >=22. The repository uses Bun for installation
      # and packaging, but npm's download cache is retained for Node tooling.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('knightcode/package.json', 'knightcode/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~\.bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('knightcode/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build the KnightCode engine
        working-directory: knightcode
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          # The provider JSON catalogs are generated from the live model data
          # and are intentionally not committed to the engine repository.
          bun run hydrate:model-data
          bun run scripts/build.ts --engine --target=win32-x64

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc
          components: rustfmt, clippy, rust-analyzer, rust-src
          targets: wasm32-wasip2, wasm32-unknown-unknown, x86_64-unknown-linux-musl

      - name: Check native workbench sources and artwork
        shell: pwsh
        run: |
          node script/check-build-workbench.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Build source/artwork validation failed.' }
          node script/check-home-design.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Home source/artwork validation failed.' }
          # Pure sizing tests cover logical pixels/DPI without another large test binary.
          $homeTests = Join-Path $env:RUNNER_TEMP 'knightcode-home-layout-tests.exe'
          rustc --edition 2024 --test crates/knightcode_onboarding/src/workspace_modes/home_layout.rs -o $homeTests
          if ($LASTEXITCODE -ne 0) { throw 'Home viewport sizing tests did not compile.' }
          & $homeTests
          if ($LASTEXITCODE -ne 0) { throw 'Home viewport/DPI sizing regression tests failed.' }
          rustfmt --edition 2024 --check `
            crates/knightcode_onboarding/src/build_layout.rs `
            crates/knightcode_onboarding/src/build_welcome.rs `
            crates/knightcode_onboarding/src/workspace_modes.rs `
            crates/knightcode_onboarding/src/workspace_modes/home_presentation.rs `
            crates/knightcode_onboarding/src/workspace_modes/home_layout.rs `
            crates/title_bar/src/title_bar.rs `
            crates/platform_title_bar/src/platform_title_bar.rs `
            crates/agent_ui/src/conversation_view/thread_view/build_presentation.rs
          if ($LASTEXITCODE -ne 0) { throw 'Native Build formatting failed.' }

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: true
          cache-on-failure: true

      - name: Install Windows packaging prerequisites
        shell: pwsh
        run: |
          choco install --no-progress --yes nasm llvm cmake innosetup
          $nasm = Join-Path $env:ProgramData 'chocolatey\bin'
          "$nasm" >> $env:GITHUB_PATH

      - name: Acquire verified desktop resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path target/resources | Out-Null
          $resourceDirectory = 'target/resources/desktop'
          $reuseResources = $false
          # The Cargo target cache can restore this bundle from a previous run.
          # Never reuse it without checking the reviewed specification and hashes.
          if (Test-Path -LiteralPath $resourceDirectory) {
            try {
              script/acquire-desktop-resources.ps1 `
                -OutputDirectory $resourceDirectory `
                -ExpectedArchitecture x64 -VerifyOnly
              $reuseResources = $true
            } catch {
              Write-Warning "Cached desktop resources failed verification; reacquiring: $($_.Exception.Message)"
              Remove-Item -LiteralPath $resourceDirectory -Recurse -Force
            }
          }
          if (-not $reuseResources) {
            script/acquire-desktop-resources.ps1 `
              -OutputDirectory $resourceDirectory `
              -ExpectedArchitecture x64
          }

      - name: Set bundle version
        shell: pwsh
        run: |
          $version = (& script/get-crate-version.ps1 zed).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not determine the zed package version.'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "ZED_RELEASE_CHANNEL=stable" >> $env:GITHUB_ENV

      - name: Verify native Windows prerequisites
        shell: pwsh
        run: script/check-native-prerequisites.ps1 -ForBundle

      - name: Build the Windows installer
        shell: pwsh
        run: script/bundle-windows.ps1

      - name: Test native Chat session and draft continuity
        if: ${{ inputs.run_chat_tests }}
        shell: pwsh
        timeout-minutes: 120
        env:
          ZED_HEADLESS: "1"
          ZED_BUNDLE: "true"
          GGML_NATIVE: "OFF"
          PENDING_TRACES: "1"
        run: |
          cargo --config .cargo/bundle-config.toml test --release `
            --package agent_ui --features audio --lib --jobs 2 `
            --target x86_64-pc-windows-msvc test_full_page_chat -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'Native Chat regression tests failed.'
          }

      - name: Test Chat workspace chrome and Build restoration
        if: ${{ inputs.run_chat_tests }}
        shell: pwsh
        timeout-minutes: 120
        env:
          ZED_HEADLESS: "1"
          ZED_BUNDLE: "true"
          GGML_NATIVE: "OFF"
          PENDING_TRACES: "1"
        run: |
          cargo --config .cargo/bundle-config.toml test --release `
            --package workspace --lib --jobs 2 `
            --target x86_64-pc-windows-msvc test_chat_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Chat status bar/tab predicate regression tests failed.' }

      - name: Test native Build session and draft continuity
        if: ${{ inputs.run_build_tests }}
        shell: pwsh
        timeout-minutes: 120
        env:
          ZED_HEADLESS: "1"
          ZED_BUNDLE: "true"
          GGML_NATIVE: "OFF"
          PENDING_TRACES: "1"
        run: |
          cargo --config .cargo/bundle-config.toml test --release `
            --package agent_ui --features audio --lib --jobs 2 `
            --target x86_64-pc-windows-msvc test_build_workbench -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native Build regression tests failed.' }

      - name: Upload the Windows installer and executable
        uses: actions/upload-artifact@v4
        with:
          name: KnightCode-windows-x86_64
          path: |
            target/KnightCode-x86_64.exe
            inno/x86_64/KnightCode.exe
          if-no-files-found: error
          retention-days: 14
